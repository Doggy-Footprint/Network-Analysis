<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
@@STYLE@@
</style>
</head>
<body>
<main class="report-shell">
@@COMPONENTS@@
</main>
<script id="@@PAYLOAD_ID@@" type="application/octet-stream">@@DATA@@</script>
<script>
(function () {
  "use strict";
  const status = document.getElementById("report-status");
  const decode = async function (encoded) {
    if (typeof globalThis.DecompressionStream !== "function") {
      throw new Error('이 브라우저는 DecompressionStream("gzip")을 지원하지 않습니다. 최신 Chromium, Firefox 또는 Safari에서 이 오프라인 파일을 여세요.');
    }
    const bytes = Uint8Array.from(atob(encoded.trim()), function (character) { return character.charCodeAt(0); });
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new TextDecoder().decode(await new Response(stream).arrayBuffer());
  };
  window.ReportPayload = {
    decodeOccurrenceBlock: async function (block) { return JSON.parse(await decode(block.data)); }
  };
  window.ReportReady = (async function () {
    try {
      const encoded = document.getElementById("@@PAYLOAD_ID@@").textContent;
      const graph = JSON.parse(await decode(encoded));
      window.ReportPayload.data = graph;
      status.textContent = @@READY_LABEL@@;
      document.dispatchEvent(new CustomEvent("@@READY_EVENT@@", { detail: graph }));
      return graph;
    } catch (error) {
      status.className = "error";
      status.textContent = error.name + ": " + error.message;
      throw error;
    }
  }());
}());
</script>
@@SCRIPTS@@
</body>
</html>
