id: agent_view.v3
version: 3
limits:
  min_term_length: 3
  max_file_bytes: 1048576
  read_unit_token_limit: 8000
  read_query_candidate_limit: 3
  search_output_limit: 30
  hint_query_limit: 4
  refinement_threshold: 50
  refinement_query_limit: 4
  refinement_depth_limit: 2
  root_list_depth: 2
  root_list_entry_limit: 200
  occurrence_block_rows: 4096
  context_lines: 0
  generated_marker_lines: 8
include_agent_docs: true
tracked_files_only: true
tokenizer:
  characters_per_token: 4
  digit_group_size: 3
versions:
  split: symbol-greedy-v1
  ordering: path-line-byte-v1
  output_format: match-line-v1
  query_equivalence: kind-term-surface-scope-rules-v1
  tokenizer: chars-div4-digit-group3-v1
provenance:
  read_limit: "Harness command: sed -n '1,2000p' FILE; measured ceiling: 8000 estimated tokens"
  search_limit: "Harness command: rg --json TERM ROOT | head -n 30; configured visible occurrence ceiling: 30"
  tokenizer: "language_analyzers/core/cost.py estimate_tokens: non-digit characters per 4 and digit runs per 3"
  query_candidate_limit: "Harness trace field: follow_up_queries_after_read; retained positions: 1-3"
exclusions:
  vendor_globs: ["vendor/**", "node_modules/**", "third_party/**"]
  generated_globs: ["build/**", "dist/**", "*.min.js"]
  generated_markers: ["generated file", "do not edit"]
  lockfile_names: [package-lock.json, yarn.lock, pnpm-lock.yaml, poetry.lock, Pipfile.lock]
transforms:
  - id: split-case
  - id: token-adjacent-pairs
  - id: normalize-case
  - id: plural-singular
  - id: strip-affix
    prefixes: [get, set, is, has, "on", handle, build, create]
    suffixes: [Impl, Service, Controller, Handler, Manager, Factory, ViewModel, Repository]
