version: 1
layers:
  api:
    paths: ["app/api/**"]
  services:
    paths: ["app/services/**"]
  db:
    paths: ["app/db/**"]
  domain:
    packages: ["pkg:python:app.models.domain"]
  schemas:
    packages: ["pkg:python:app.models.schemas"]
  core:
    paths: ["app/core/**", "app/resources/**"]
allow:
  domain: []
forbid:
  - from: db
    to: [api]
  - from: services
    to: [api]
