id: exploration_policy.v1
version: 1
phase_a:
  root_list_query: true
  structural_repo_map:
    enabled: true
    rank: pagerank
    max_entries: 200
    token_budget: 1024
phase_b:
  policy: bfs-exhaust
  result_ordering: hint-prior
  revisit_probability: 0.0
hint_prior:
  role_weights:
    declaration: 3.0
    path: 2.0
    import: 1.5
    call: 1.0
    reference: 1.0
    literal: 1.0
    doc: 0.5
    comment: 0.5
    test: 0.25
  filename_exact_bonus: 2.0
sampling:
  min_samples: 200
  max_samples: 2000
  batch: 100
  convergence_metric: p50_weighted_cost
  relative_tolerance: 0.01
  bootstrap_resamples: 1000
  bootstrap_interval: 0.95
  seed: 20260907
tie_break:
  version: axis-lex-seqlen-idseq-v1
provenance:
  policy: "unevidenced. research/6b0ef0fa381f1563-agent-strategy-survey.md records bfs-exhaust as having no survey citation; the bfs-exhaust vs best-first-pivot trace comparison is the falsification path."
  result_ordering: "unevidenced. The same survey records hint-prior as uncalibrated; uniform is kept alongside it so the prior's effect is observable as the difference between two runs."
  revisit_probability: "0 by contract until set from real agent logs; the revisit axis stays 0 while it is 0."
  structural_repo_map: "Design addition, not a survey finding. Preloading a PageRank-ranked structural map before any query is a phase-A seed mechanism; enabled by default so the baseline reports it, and switchable off to measure its effect."
  hint_prior: "temporary, unevidenced role weights. Declaration over use, path matches over content matches, tests deprioritized."
  sampling: "temporary. Tuned against fixtures, not against agent traces."
history:
  - version: 1
    change: "Initial policy profile for M3 phase A and phase B."
