id: cost_weights.v1
version: 1
weights:
  exploration_turns: 10
  search_tool_calls: 10
  read_tool_calls: 10
  query_result_tokens: 1
  readable_node_tokens: 1
  zero_result_queries: 0
  revisits: 10
  exposed_non_target_candidates: 0
  duplicate_occurrences: 0
axis_priority:
  - readable_node_tokens
  - query_result_tokens
  - read_tool_calls
  - search_tool_calls
  - exploration_turns
  - zero_result_queries
  - exposed_non_target_candidates
  - duplicate_occurrences
  - revisits
provenance:
  exploration_turns: "temporary, unevidenced"
  search_tool_calls: "temporary, unevidenced"
  read_tool_calls: "temporary, unevidenced"
  query_result_tokens: "temporary, unevidenced"
  readable_node_tokens: "temporary, unevidenced"
  zero_result_queries: "temporary, unevidenced"
  revisits: "temporary, unevidenced"
  exposed_non_target_candidates: "temporary, unevidenced"
  duplicate_occurrences: "temporary, unevidenced"
  axis_priority: "temporary, unevidenced; fixed independently of the weights so replacing a weight does not change tie-break order"
history:
  - version: 1
    change: "Initial temporary weights. Token axes carry one unit per token because context tokens are what the agent spends; turn and tool-call axes carry a small per-unit weight. The 0-result, non-target-exposure and duplicate-occurrence axes are weighted 0 so they are reported without steering which run is selected at a percentile. No value here is calibrated against agent traces."
