<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{TITLE}}</title><style>{{CSS}}</style></head><body>
<header class="masthead"><a href="#report-summary" class="brand">DEPENDENCY / REPORT</a><span>정적 분석 · 구조적 근거</span></header>
<main><section id="report-summary"><h1>{{TITLE}}</h1><div id="scope" class="scope"></div><div id="kpi" class="kpi-row"></div><div id="report-status" role="status"></div></section>
<section id="representatives-section"><div class="section-heading"><div><div class="eyebrow">01 / 지표별 대표 대상</div></div><label id="category-filter">코드 분류<select><option value="production">운영 코드</option><option value="all">전체</option><option value="test">테스트</option><option value="generated">생성 코드</option><option value="vendored">외부 코드</option><option value="unknown">미분류</option></select></label></div><div id="representatives" class="metric-grid"></div></section>
<section id="review-section"><div class="eyebrow">02 / 그래프 · 목록</div><div class="tabs" role="tablist" aria-label="보기 전환"><button id="tab-graph" role="tab" aria-controls="panel-graph" aria-selected="false">그래프</button><button id="tab-list" role="tab" aria-controls="panel-list" aria-selected="true">목록</button></div>
<div id="panel-graph" role="tabpanel" aria-labelledby="tab-graph" hidden><div class="graph-toolbar"><label>파일 검색<input id="graph-search" type="search" list="graph-search-options" placeholder="파일 경로" autocomplete="off"></label><datalist id="graph-search-options"></datalist><label id="graph-size">크기 기준<select></select></label><button id="graph-reset" type="button">화면 리셋</button><output id="graph-status" role="status"></output></div><div id="graph-legend" class="legend"></div><div id="graph-container" aria-label="파일 의존성 그래프"></div></div>
<div id="panel-list" role="tabpanel" aria-labelledby="tab-list"><div class="filters"><label>이름·경로 검색<input id="node-search" type="search" placeholder="심볼 이름 또는 파일 경로"></label><label id="metric-sort">정렬 지표<select></select></label><label id="candidate-kind-filter">후보 종류<select><option value="all">전체 대상</option><option value="unresolved_boundary">정적 분석 미확정 참조</option><option value="evidence_spread">근거 분산</option><option value="large_node">큰 노드</option></select></label><label id="list-limit">표시 범위<select><option value="100">상위 100개</option><option value="all">전체 대상</option></select></label></div><div class="list-heading"><output id="list-count"></output><span>한 페이지에 50개</span></div><div class="table-wrap"><table><thead><tr><th>대상 / 소스 위치</th><th>후보</th><th id="sort-heading">지표</th></tr></thead><tbody id="node-list"></tbody></table></div><nav class="pagination" aria-label="목록 페이지"><button id="page-prev">이전</button><span id="page-label"></span><button id="page-next">다음</button></nav></div></section>
<section><details id="report-appendix"><summary>부록</summary><div id="appendix-content"><table id="settings-table"><thead><tr><th>구분</th><th>항목</th><th>값</th></tr></thead><tbody></tbody></table><h3>읽는 방법</h3><ul id="reading-guide"></ul></div></details></section></main>
<div id="modal-backdrop" hidden><div id="node-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="modal-close" type="button" aria-label="닫기">닫기</button><div id="modal-content"></div></div></div>
<div id="term-tooltip" role="tooltip" hidden></div>
<script id="report-data" type="application/json">{{DATA}}</script><script>window.__visFailed=false</script><script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" onerror="window.__visFailed=true"></script><script>{{JS}}</script></body></html>
